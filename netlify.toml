[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  framework = "#custom"

# SPA fallback. Not needed today (single route) but required the moment
# client-side routing arrives in sub-project 3.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
